<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ENES AYDIN | BASH</title>
  <meta name="description" content="Enes Aydın kişisel terminal tarzı portfolio web sitesi. Projeler, eğitim, iletişim, sosyal medya hesapları ve CV bilgileri." />
  <meta name="keywords" content="Enes Aydın, Enes Aydin, Enes Aydın Portfolio, Enes Aydın BASH, yazılım geliştirici, portfolio" />
  <meta name="author" content="Enes Aydın" />
  <meta name="robots" content="index, follow" />

  <link rel="icon" href="assets/logo.png" type="image/x-icon">

  <style>
    :root {
      --bg: #1d2323;
      --text: #e8e6d9;
      --muted: #caa6bd;
      --green: #00e6a8;
      --red: #ff6b6b;
      --selection: #334155;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Mono", Consolas, monospace;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
    }

    body {
      overflow-x: hidden;
    }

    ::selection {
      background: var(--selection);
      color: var(--text);
    }

    #terminal {
      width: 100%;
      min-height: 100vh;
      padding: 14px 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line {
      min-height: 19px;
    }

    .prompt {
      color: var(--text);
      font-weight: 700;
    }

    .username {
      color: var(--text);
    }

    .host {
      color: var(--green);
    }

    .path {
      color: var(--text);
    }

    .command {
      color: var(--text);
      font-weight: 700;
    }

    .output {
      color: var(--text);
      font-weight: 700;
      margin-bottom: 14px;
      max-width: 900px;
    }

    .muted {
      color: var(--muted);
    }

    .green {
      color: var(--green);
    }

    .red {
      color: var(--red);
    }

    .input-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      min-height: 19px;
    }

    #cmdInput {
      flex: 1;
      min-width: 120px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      caret-color: var(--text);
      padding: 0;
      margin-left: 6px;
    }

    a {
      color: var(--green);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .seo-content {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      html,
      body {
        font-size: 13px;
      }

      #terminal {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <main id="terminal"></main>

  <script>
    const terminal = document.getElementById("terminal");

    const USERNAME = "enesaydn";
    const HOST = "bash";
    const PATH = "~";

    const FULL_NAME = "Enes Aydın";
    const EMAIL = "infoenesaydn@gmail.com";
    const GITHUB = "https://github.com/enesaydnn";
    const LINKEDIN = "https://www.linkedin.com/in/enesaydn/";

    let history = [];
    let historyIndex = -1;

    const commandsInfo = {
      whoami: "Ben Kimim?",
      clear: "Terminali Temizle",
      echo: "Metni Terminale Yazdır",
      education: "Eğitim Bilgilerim",
      email: "E-posta Bilgim",
      help: "Komut Listesi",
      projects: "Projelerim",
      resume: "Özgeçmişim (CV)",
      socials: "Sosyal Medya Hesaplarım",
      welcome: "Karşılama Mesajını Tekrar Göster"
    };

    const commandNames = Object.keys(commandsInfo);

    function promptHTML() {
      return `<span class="prompt"><span class="username">${USERNAME}</span>@<span class="host">${HOST}</span>:<span class="path">${PATH}</span>$</span>`;
    }

    function scrollBottom() {
      window.scrollTo(0, document.body.scrollHeight);
    }

    function addLine(html = "", className = "line") {
      const line = document.createElement("div");
      line.className = className;
      line.innerHTML = html;
      terminal.appendChild(line);
      scrollBottom();
    }

    function addOutput(html = "") {
      const output = document.createElement("div");
      output.className = "output";
      output.innerHTML = html;
      terminal.appendChild(output);
      scrollBottom();
    }

    function addPromptInput() {
      const line = document.createElement("div");
      line.className = "input-line";
      line.innerHTML = `${promptHTML()} <input id="cmdInput" autocomplete="off" autofocus />`;
      terminal.appendChild(line);

      const input = document.getElementById("cmdInput");
      input.focus();
      input.addEventListener("keydown", handleKeydown);

      scrollBottom();
    }

    function replaceInputWithCommand(command) {
      const inputLine = document.querySelector(".input-line");
      if (!inputLine) return;

      inputLine.className = "line";
      inputLine.innerHTML = `${promptHTML()} <span class="command">${escapeHTML(command)}</span>`;
    }

    function escapeHTML(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function handleKeydown(e) {
      const input = e.target;

      if (e.key === "Enter") {
        const command = input.value.trim();

        replaceInputWithCommand(command);

        if (command.length > 0) {
          history.push(command);
          historyIndex = history.length;
        }

        runCommand(command);
        return;
      }

      if (e.key === "ArrowUp") {
        e.preventDefault();

        if (history.length === 0) return;

        if (historyIndex > 0) {
          historyIndex--;
        }

        input.value = history[historyIndex] || "";
        setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
        return;
      }

      if (e.key === "ArrowDown") {
        e.preventDefault();

        if (history.length === 0) return;

        if (historyIndex < history.length - 1) {
          historyIndex++;
          input.value = history[historyIndex];
        } else {
          historyIndex = history.length;
          input.value = "";
        }

        return;
      }

      if (e.key === "Tab") {
        e.preventDefault();

        const current = input.value.trim().toLowerCase();
        if (!current) return;

        const matches = commandNames.filter(cmd => cmd.startsWith(current));

        if (matches.length === 1) {
          input.value = matches[0];
        } else if (matches.length > 1) {
          addOutput(matches.map(item => `<span class="green">${item}</span>`).join("    "));
        }

        return;
      }

      if (e.ctrlKey && e.key.toLowerCase() === "l") {
        e.preventDefault();
        clearTerminal();
        return;
      }
    }

    function runCommand(rawCommand) {
      const [command, ...args] = rawCommand.split(" ");
      const cmd = command.toLowerCase();
      const rest = args.join(" ");

      if (!cmd) {
        addPromptInput();
        return;
      }

      switch (cmd) {
        case "welcome":
          addOutput(welcomeText());
          break;

        case "help":
          addOutput(helpText());
          break;

        case "whoami":
          addOutput(whoamiText());
          break;

        case "projects":
          addOutput(projectsText());
          break;

        case "education":
          addOutput(educationText());
          break;

        case "email":
          addOutput(emailText());
          break;

        case "socials":
          addOutput(socialsText());
          break;

        case "resume":
          addOutput(resumeText());
          break;

        case "echo":
          addOutput(escapeHTML(rest));
          break;

        case "clear":
          clearTerminal();
          return;

        default:
          addOutput(`<span class="red">command not found:</span> ${escapeHTML(cmd)}

Kullanılabilir komutları görmek için <span class="green">help</span> yaz.`);
          break;
      }

      addPromptInput();
    }

    function welcomeText() {
      return `Merhaba! Ben <span class="green">Enes</span>.

Diğer portföy sitelerinden biraz farklı bir tasarım kullandım. 
Klasik menüler yerine komut tabanlı bir yapı tercih ettim 
böylece herkes terminal benzeri bir deneyim yaşayabiliyor. 
Siteyi kullanmak için help komutunu çalıştırarak mevcut komutları görebilirsiniz.

Bu fikir, teslim ettiğimiz minishell projesinden esinlenerek geliştirildi o7.
<span class="green">help</span> yazman yeterli.`;
    }
    function helpText() {
      const rows = Object.entries(commandsInfo)
        .map(([cmd, desc]) => {
          const padded = cmd.padEnd(12, " ");
          return `<span class="green">${padded}</span> - <span class="muted">${desc}</span>`;
        })
        .join("\n");

      return `${rows}

Tab veya Ctrl + i  => Komutu otomatik tamamlar.
Yukarı Ok          => Önceki komutu getirir.
Ctrl + l           => Terminali temizler.`;
    }

    function whoamiText() {
      return `<span class="green">${FULL_NAME}</span>

Bilgisayar Programcılığı ile başlayan akademik yolculuğuma, şu anda Yönetim Bilişim Sistemleri lisans öğrencisi olarak devam ediyorum. Yazılım geliştirme sürecinde teorik bilgiyi pratikle birleştirmeyi ve öğrendiklerimi gerçek projeler üzerinde uygulamayı seviyorum.

Klasik eğitimin ötesine geçmek adına, dünyanın önde gelen yazılım okullarından biri olan 42 Türkiye’nin bir parçasıyım. Burada “öğrenmeyi öğrenmek” felsefesiyle ilerleyerek, gerçek dünya problemlerine kod ile çözümler üretiyor; C ve C++ gibi düşük seviyeli dillerden modern web teknolojilerine kadar geniş bir teknoloji yelpazesinde projeler geliştiriyorum.
Kullanıcı: ${USERNAME}
Host     : ${HOST}`;
    }

    function educationText() {
      return `<span class="green">Eğitim Bilgilerim</span>

Okul       : Karabük Üniversitesi
Bölüm      : Bilgisayar Programcılığı
Durum      : Mezun
Ortalama   : 4/3.09

Okul       : Anadolu Üniversitesi
Bölüm      : Yönetim Bilişim Sistemleri
Durum      : 4/4
Ortalama   : 4/3.03

Okul       : 42 Türkiye
Bölüm      : Bilgisayar Bilimleri
Durum      : Common Core
`;
    }

    function emailText() {
      return `<span class="green">E-posta Bilgim</span>

Bana ulaşmak için: <a href="mailto:${EMAIL}">infoenesaydn@gmail.com</a>`;
    }

    function projectsText() {
      return `Merhaba, güncel projelerimi 
<a href="https://github.com/enesaydnn" target="_blank">GITHUB</a> hesabımdan inceleyebilirsiniz. `;
    }

    function resumeText() {
      return `Özgeçmişimi İndirmek İçin Link'e Tıklayın;
<a href="assets/01_Enes_Aydın_Resume.pdf" download>Cv İndir</a>`;
    }

    function socialsText() {
      return `<span class="green">Sosyal Medya Hesaplarım</span>

GitHub    : <a href="${GITHUB}" target="_blank" rel="noopener noreferrer">GITHUB</a>
LinkedIn  : <a href="${LINKEDIN}" target="_blank" rel="noopener noreferrer">LINKEDIN</a>
`;
    }

    function clearTerminal() {
      terminal.innerHTML = "";
      addPromptInput();
    }

    function boot() {
      addLine(`${promptHTML()} <span class="command">welcome</span>`);
      addOutput(welcomeText());
      addPromptInput();
    }

    document.addEventListener("click", () => {
      const input = document.getElementById("cmdInput");
      if (input) input.focus();
    });

    boot();
  </script>
</body>
</html>
