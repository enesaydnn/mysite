    <div class="section-container">

                <div class="col-xs-12">
                    <div class="section-container-spacer text-center">
                        <h1 class="h2">04 : Bana Ulaş</h1>
                    </div>

                    <div class="row">
                        <div class="col-md-10 col-md-offset-1">

                            <!-- CONTACT FORM -->
                            <form id="contact-form" class="reveal-content">
                                <div class="row">
                                    <div class="col-md-7">

                                        <!-- GİZLİ VE KİLİTLİ EMAIL -->
                                        <input type="hidden" name="email" id="email" value="infoenesaydn@gmail.com">

                                        <div class="form-group">
                                            <input type="text" name="subject" id="subject" class="form-control"
                                                placeholder="Konu" required>
                                        </div>

                                        <div class="form-group">
                                            <textarea name="message" id="message" class="form-control" rows="5"
                                                placeholder="Mesajınızı Giriniz" required></textarea>
                                        </div>

                                        <button type="submit" class="btn btn-default btn-lg">Gönder</button>

                                        <!-- Mesaj durumu -->
                                        <div id="status-message" style="margin-top:10px; font-weight:bold;"></div>

                                    </div>

                                    <div class="col-md-5">
                                        <h3>Sosyal Medya Hesaplarım</h3>
                                        <a href="https://github.com/enesaydnn" class="fa-icon">
                                            <i class="fa fa-github"></i>
                                        </a>
                                        <a href="https://www.linkedin.com/in/enesaydn/" class="fa-icon">
                                            <i class="fa fa-linkedin"></i>
                                        </a>
                                    </div>
                                </div>
                            </form>
                            <!-- END CONTACT FORM -->

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- EMAILJS SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        (function () {
            // Public Key ile EmailJS'i başlat
            emailjs.init("v8MaP3CxVRQ0uWHo6");
        })();

        const form = document.getElementById("contact-form");
        const statusMessage = document.getElementById("status-message");

        form.addEventListener("submit", function (event) {
            event.preventDefault(); // Sayfanın yenilenmesini engelle

            statusMessage.style.color = "dark";
            statusMessage.textContent = "Mesaj gönderiliyor...";

            emailjs.send(
                "service_1c270oh",
                "template_qg1hi3r",
                {
                    email: document.getElementById("email").value, // sabit email
                    subject: document.getElementById("subject").value,
                    message: document.getElementById("message").value
                }
            ).then(function () {
                statusMessage.style.color = "dark";
                statusMessage.textContent = "Mesaj başarıyla gönderildi";
                form.reset();
            }, function (error) {
                statusMessage.style.color = "dark";
                statusMessage.textContent = "Mesaj gönderilemedi. Lütfen tekrar deneyin.";
                console.error(error);
            });
        });
    </script>
